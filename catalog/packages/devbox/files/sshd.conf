# The devbox's whole sshd configuration (the service runs sshd -f with it).
# Host keys live on the state volume, created by ssh-keygen -A at start.
HostKey /var/lib/devbox/etc/ssh/ssh_host_ed25519_key
HostKey /var/lib/devbox/etc/ssh/ssh_host_ecdsa_key
HostKey /var/lib/devbox/etc/ssh/ssh_host_rsa_key

# root stays key-only; the devbox user logs in with the password from settings
PermitRootLogin prohibit-password
PasswordAuthentication yes
KbdInteractiveAuthentication no

Subsystem sftp /usr/libexec/sftp-server

# `ssh host CMD` runs a non-interactive bash: give it the login environment
Match User *,!root
	SetEnv BASH_ENV=/etc/profile.d/devbox.sh
